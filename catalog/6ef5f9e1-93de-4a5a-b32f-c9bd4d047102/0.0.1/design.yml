# Carebound — HIPAA-aligned healthcare data plane
# Author: Olaleye Oyewunmi
# Catalog type: Security
# Technologies: Kubernetes, Gateway API, External Secrets, CloudNativePG, Kyverno, OpenTelemetry
#
# Catalog description:
# Carebound is a reference architecture for a healthcare application data plane.
# Patient-facing traffic enters through Gateway API, clinical APIs run behind
# default-deny NetworkPolicies, secrets are pulled from AWS Secrets Manager
# (never stored in Git), and PostgreSQL is managed by CloudNativePG on an
# encrypted StorageClass. Kyverno enforces encryption labels and blocks
# privileged pods. OpenTelemetry Collector is the only path logs and traces
# take out of the clinical namespace.
#
# Caveats:
# This is a pattern, not a HIPAA authorization. You still need a BAA with
# your cloud provider, audit log retention, workforce access reviews, and a
# threat model. Replace the placeholder IRSA role, S3 WAL bucket, and
# container images before apply. Do not put real PHI in this design.

---
apiVersion: v1
kind: Namespace
metadata:
  name: carebound-edge
  labels:
    carebound.io/plane: edge
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: carebound-clinical
  labels:
    carebound.io/plane: clinical
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: carebound-data
  labels:
    carebound.io/plane: data
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: carebound-observe
  labels:
    carebound.io/plane: observe
    pod-security.kubernetes.io/enforce: baseline

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: carebound-encrypted-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: alias/carebound-ebs
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: carebound-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: carebound-edge
  namespace: carebound-edge
spec:
  gatewayClassName: carebound-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.carebound.example
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              carebound.io/plane: clinical
      tls:
        mode: Terminate
        certificateRefs:
          - name: carebound-edge-tls
            kind: Secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clinical-api
  namespace: carebound-clinical
spec:
  parentRefs:
    - name: carebound-edge
      namespace: carebound-edge
  hostnames:
    - api.carebound.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /fhir
      backendRefs:
        - name: fhir-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /intake
      backendRefs:
        - name: intake-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: clinical-api
          port: 8080

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clinical-api
  namespace: carebound-clinical
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/carebound-clinical-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fhir-gateway
  namespace: carebound-clinical
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/carebound-fhir-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-api
  namespace: carebound-clinical
  labels:
    app.kubernetes.io/name: clinical-api
    carebound.io/tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-api
        carebound.io/tier: api
    spec:
      serviceAccountName: clinical-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/carebound/clinical-api:1.4.2
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: clinical-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-api
  namespace: carebound-clinical
  labels:
    app.kubernetes.io/name: intake-api
    carebound.io/tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intake-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intake-api
        carebound.io/tier: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/carebound/intake-api:1.2.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: intake-api-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-gateway
  namespace: carebound-clinical
  labels:
    app.kubernetes.io/name: fhir-gateway
    carebound.io/tier: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fhir-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fhir-gateway
        carebound.io/tier: edge
    spec:
      serviceAccountName: fhir-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/carebound/fhir-gateway:0.9.1
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: clinical-api
  namespace: carebound-clinical
spec:
  selector:
    app.kubernetes.io/name: clinical-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: intake-api
  namespace: carebound-clinical
spec:
  selector:
    app.kubernetes.io/name: intake-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-gateway
  namespace: carebound-clinical
spec:
  selector:
    app.kubernetes.io/name: fhir-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: carebound-clinical
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-apis
  namespace: carebound-clinical
spec:
  podSelector:
    matchLabels:
      carebound.io/tier: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              carebound.io/plane: edge
        - podSelector:
            matchLabels:
              carebound.io/tier: edge
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-tier
  namespace: carebound-clinical
spec:
  podSelector:
    matchLabels:
      carebound.io/tier: edge
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              carebound.io/plane: edge
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              carebound.io/tier: api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  namespace: carebound-clinical
spec:
  podSelector:
    matchLabels:
      carebound.io/tier: api
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              carebound.io/plane: data
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              carebound.io/plane: observe
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: carebound-aws-secrets
spec:
  conditions:
    - namespaces:
        - carebound-clinical
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clinical-api-secrets
  namespace: carebound-clinical
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: carebound-aws-secrets
    kind: ClusterSecretStore
  target:
    name: clinical-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: carebound/clinical-api
        property: database_url
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: carebound/clinical-api
        property: encryption_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intake-api-secrets
  namespace: carebound-clinical
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: carebound-aws-secrets
    kind: ClusterSecretStore
  target:
    name: intake-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: carebound/intake-api
        property: database_url

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: carebound-pg
  namespace: carebound-data
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/carebound-pg-backup
  storage:
    size: 50Gi
    storageClass: carebound-encrypted-gp3
  postgresql:
    parameters:
      ssl: "on"
      log_connections: "on"
      log_disconnections: "on"
  backup:
    barmanObjectStore:
      destinationPath: s3://carebound-pg-wal/
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: carebound-pg-nightly
  namespace: carebound-data
spec:
  cluster:
    name: carebound-pg
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: true
  method: barmanObjectStore

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: carebound-require-encrypted-storage
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: pvc-must-use-encrypted-class
      match:
        any:
          - resources:
              kinds: ["PersistentVolumeClaim"]
              namespaces: ["carebound-data", "carebound-clinical"]
      validate:
        message: PVCs in Carebound namespaces must use carebound-encrypted-gp3.
        pattern:
          spec:
            storageClassName: carebound-encrypted-gp3
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: carebound-deny-privileged
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["carebound-clinical", "carebound-data", "carebound-edge"]
      validate:
        message: Privileged containers are not allowed on the Carebound data plane.
        pattern:
          spec:
            =(securityContext):
              =(privileged): false
            containers:
              - =(securityContext):
                  =(privileged): false
                  =(allowPrivilegeEscalation): false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: carebound-observe
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: carebound-observe
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: carebound-observe
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
      batch: {}
      attributes:
        actions:
          - key: carebound.plane
            value: clinical
            action: upsert
    exporters:
      otlp/backend:
        endpoint: tempo.carebound-observe.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes, batch]
          exporters: [otlp/backend]

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: clinical-quota
  namespace: carebound-clinical
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinical-api
  namespace: carebound-clinical
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-api
