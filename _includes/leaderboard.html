<section class="leaderboard-section">

    <div class="leaderboard-controls">
        <div class="period-toggle">
            <label for="period-select" class="visually-hidden">Leaderboard time period</label>
            <select id="period-select" class="period-select" aria-label="Leaderboard time period">
                <option value="weekly">Week</option>
                <option value="monthly">Month</option>
                <option value="yearly">Year</option>
                <option value="all">All Time</option>
            </select>
        </div>
        <div class="board-tabs-wrapper" role="group" aria-label="Select Leaderboard">
            <div class="board-tabs">
                <button id="tab-discourse" class="tab-button active-tab" aria-pressed="true">Community</button>
                <button id="tab-github" class="tab-button" aria-pressed="false">GitHub</button>
            </div>
        </div>
        <div class="filter-wrapper">
            <label for="leaderboard-filter" class="visually-hidden">Search leaderboard by username</label>
            <input type="text" id="leaderboard-filter" class="leaderboard-filter" placeholder="Search username" />
        </div>
    </div>

    <div id="board-discourse">
        <div class="leaderboard-podium" id="discourse-podium"></div>
        <div class="leaderboard-wrapper" id="discourse-wrapper">
            <table class="leaderboard-table" id="discourse-table">
                <thead>
                    <tr>
                        <th scope="col">Rank</th>
                        <th scope="col">Member</th>
                        <th scope="col">Likes Received</th>
                        <th scope="col">Posts</th>
                        <th scope="col">Solutions Accepted</th>
                        <th scope="col">Total Points</th>
                    </tr>
                </thead>
                <tbody id="discourse-tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="board-github" style="display: none;">
        <div class="leaderboard-podium" id="github-podium"></div>
        <div class="leaderboard-wrapper" id="github-wrapper">
            <table class="leaderboard-table" id="github-table">
                <thead>
                    <tr>
                        <th scope="col">Rank</th>
                        <th scope="col">GitHub User</th>
                        <th scope="col">Issues Opened</th>
                        <th scope="col">PRs Opened</th>
                        <th scope="col">PRs Reviewed</th>
                        <th scope="col">Activity Score</th>
                    </tr>
                </thead>
                <tbody id="github-tbody"></tbody>
            </table>
        </div>
    </div>

    <p class="leaderboard-empty-state" id="leaderboard-empty-state" style="display:none;">
        No activity for this period yet.
    </p>

    <p class="leaderboard-updated">Last updated: {{ site.data.leaderboard.last_updated | date: "%B %-d, %Y" }}</p>

</section>

<script type="application/json" id="discourse-data">
    {{ site.data.leaderboard.periods | jsonify }}
</script>
<script type="application/json" id="github-data">
    {{ site.data.github_leaderboard.periods | jsonify }}
</script>

<script>
    (function () {
        var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function fmt(d, includeYear) {
            var str = MONTHS[d.getMonth()] + ' ' + d.getDate();
            if (includeYear) {
                str += ', ' + d.getFullYear();
            }
            return str;
        }

        var now   = new Date();
        var today = fmt(now);

        var week  = new Date(now); week.setDate(week.getDate() - 7);
        var month = new Date(now); month.setDate(month.getDate() - 30);
        var year  = new Date(now); year.setFullYear(year.getFullYear() - 1);

        var ranges = {
            weekly:  fmt(week) + ' \u2013 ' + today,
            monthly: fmt(month) + ' \u2013 ' + today,
            yearly:  fmt(year, true) + ' \u2013 ' + today,
            all:     ''
        };

        var names = {
            weekly:  'Week',
            monthly: 'Month',
            yearly:  'Year',
            all:     'All Time'
        };

        var periodSelectEl = document.getElementById('period-select');

        Object.keys(names).forEach(function (val) {
            var opt = periodSelectEl.querySelector('option[value="' + val + '"]');
            if (!opt) return;
            opt.textContent = ranges[val] ? (names[val] + ' \u00B7 ' + ranges[val]) : names[val];
        });
    })();
</script>

<script>

    (function () {
        var leaderboardData;
        try {
            leaderboardData = JSON.parse(document.getElementById('leaderboard-data').textContent) || {};
        } catch (e) {
            leaderboardData = {};
        }

        function medalClass(rank) {
            if (rank === 1) return 'medal-gold';
            if (rank === 2) return 'medal-silver';
            return 'medal-bronze';
        }

        function renderDiscoursePodium(users) {
            var podium = document.getElementById('discourse-podium');
            var top3 = users.filter(function (u) { return u.rank <= 3; });
            podium.innerHTML = top3.map(function (user) {
                return (
                    '<div class="podium-card podium-rank-' + user.rank + '">' +
                    '<div class="podium-card-body">' +
                    '<div class="podium-avatar-wrapper">' +
                    '<span class="medal ' + medalClass(user.rank) + '">' + user.rank + '</span>' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener">' +
                    '<img class="podium-avatar" src="' + escapeHtml(user.avatar) + '" alt="' + escapeHtml(user.username) + '" onerror="this.onerror=null; this.src=\'' + fallbackAvatar + '\';" />' +
                    '</a>' +
                    '</div>' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener" class="podium-username-link">' +
                    '<span class="podium-username">' + escapeHtml(user.username) + '</span>' +
                    '</a>' +
                    '<div class="podium-stats">' +
                    '<div class="podium-stat"><span class="podium-stat-label">Likes</span><span class="podium-stat-value">' + (Number(user.likes) || 0) + '</span></div>' +
                    '<div class="podium-stat"><span class="podium-stat-label">Posts</span><span class="podium-stat-value">' + (Number(user.posts) || 0) + '</span></div>' +
                    '<div class="podium-stat"><span class="podium-stat-label">Solutions</span><span class="podium-stat-value">' + (Number(user.solutions) || 0) + '</span></div>' +
                    '</div>' +
                    '<div class="podium-score">' + (Number(user.score) || 0) + ' pts</div>' +
                    '</div></div>'
                );
            }).join('');
        }

        function renderDiscourseTable(users) {
            var tbody = document.getElementById('discourse-tbody');
            var rest = users.filter(function (u) { return u.rank > 3; });
            tbody.innerHTML = rest.map(function (user) {
                return (
                    '<tr class="leaderboard-row">' +
                    '<td class="leaderboard-rank">' + user.rank + '</td>' +
                    '<td class="leaderboard-member">' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener">' +
                    '<img class="leaderboard-avatar" src="' + escapeHtml(user.avatar) + '" alt="' + escapeHtml(user.username) + '" onerror="this.onerror=null; this.src=\'' + fallbackAvatar + '\';" />' +
                    '<span class="leaderboard-username">' + escapeHtml(user.username) + '</span>' +
                    '</a></td>' +
                    '<td>' + (Number(user.likes) || 0) + '</td>' +
                    '<td>' + (Number(user.posts) || 0) + '</td>' +
                    '<td>' + (Number(user.solutions) || 0) + '</td>' +
                    '<td class="leaderboard-score">' + (Number(user.score) || 0) + '</td>' +
                    '</tr>'
                );
            }).join('');
        }

        function renderGithubPodium(users) {
            var podium = document.getElementById('github-podium');
            var top3 = users.filter(function (u) { return u.rank <= 3; });
            podium.innerHTML = top3.map(function (user) {
                return (
                    '<div class="podium-card podium-rank-' + user.rank + '">' +
                    '<div class="podium-card-body">' +
                    '<div class="podium-avatar-wrapper">' +
                    '<span class="medal ' + medalClass(user.rank) + '">' + user.rank + '</span>' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener">' +
                    '<img class="podium-avatar" src="' + escapeHtml(user.avatar_url) + '" alt="' + escapeHtml(user.github_username) + '" onerror="this.onerror=null; this.src=\'' + fallbackAvatar + '\';" />' +
                    '</a>' +
                    '</div>' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener" class="podium-username-link">' +
                    '<span class="podium-username">' + escapeHtml(user.github_username) + '</span>' +
                    '</a>' +
                    '<div class="podium-stats">' +
                    '<div class="podium-stat"><span class="podium-stat-label">Issues</span><span class="podium-stat-value">' + (Number(user.issues) || 0) + '</span></div>' +
                    '<div class="podium-stat"><span class="podium-stat-label">PRs</span><span class="podium-stat-value">' + (Number(user.prs) || 0) + '</span></div>' +
                    '<div class="podium-stat"><span class="podium-stat-label">Reviews</span><span class="podium-stat-value">' + (Number(user.reviews) || 0) + '</span></div>' +
                    '</div>' +
                    '<div class="podium-score">' + (Number(user.github_score) || 0) + ' pts</div>' +
                    '</div></div>'
                );
            }).join('');
        }

        function renderGithubTable(users) {
            var tbody = document.getElementById('github-tbody');
            var rest = users.filter(function (u) { return u.rank > 3; });
            tbody.innerHTML = rest.map(function (user) {
                return (
                    '<tr class="leaderboard-row">' +
                    '<td class="leaderboard-rank">' + user.rank + '</td>' +
                    '<td class="leaderboard-member">' +
                    '<a href="' + escapeHtml(user.profile_url) + '" target="_blank" rel="noopener">' +
                    '<img class="leaderboard-avatar" src="' + escapeHtml(user.avatar_url) + '" alt="' + escapeHtml(user.github_username) + '" onerror="this.onerror=null; this.src=\'' + fallbackAvatar + '\';" />' +
                    '<span class="leaderboard-username">' + escapeHtml(user.github_username) + '</span>' +
                    '</a></td>' +
                    '<td>' + (Number(user.issues) || 0) + '</td>' +
                    '<td>' + (Number(user.prs) || 0) + '</td>' +
                    '<td>' + (Number(user.reviews) || 0) + '</td>' +
                    '<td class="leaderboard-score">' + (Number(user.github_score) || 0) + '</td>' +
                    '</tr>'
                );
            }).join('');
        }

        function renderLeaderboard() {
            var users = currentBoard === 'discourse' ? (discourseData[currentPeriod] || []) : (githubData[currentPeriod] || []);

            var hasActivity = false;
            if (currentBoard === 'discourse') {
                hasActivity = users.some(function (u) { return (u.score || 0) > 0; });
            } else {
                hasActivity = users.some(function (u) {
                    return (u.issues || 0) > 0 || (u.prs || 0) > 0 || (u.reviews || 0) > 0;
                });
            }

            var emptyState = document.getElementById('leaderboard-empty-state');

            document.getElementById('board-discourse').style.display = (currentBoard === 'discourse' && hasActivity) ? 'block' : 'none';
            document.getElementById('board-github').style.display = (currentBoard === 'github' && hasActivity) ? 'block' : 'none';

            if (!hasActivity) {
                emptyState.textContent = 'No activity for this period yet.';
                emptyState.style.display = '';
                return;
            }

            emptyState.style.display = 'none';

            if (currentBoard === 'discourse') {
                renderDiscoursePodium(users);
                renderDiscourseTable(users);
            } else {
                renderGithubPodium(users);
                renderGithubTable(users);
            }
            filterLeaderboard();
        }

        var periodSelect = document.getElementById('period-select');
        periodSelect.value = currentPeriod;
        periodSelect.addEventListener('change', function () {
            currentPeriod = this.value;
            renderLeaderboard();
        });

        document.getElementById('tab-discourse').addEventListener('click', function() {
            currentBoard = 'discourse';
            this.classList.add('active-tab');
            this.setAttribute('aria-pressed', 'true');
            var other = document.getElementById('tab-github');
            other.classList.remove('active-tab');
            other.setAttribute('aria-pressed', 'false');
            renderLeaderboard();
        });

        document.getElementById('tab-github').addEventListener('click', function() {
            currentBoard = 'github';
            this.classList.add('active-tab');
            this.setAttribute('aria-pressed', 'true');
            var other = document.getElementById('tab-discourse');
            other.classList.remove('active-tab');
            other.setAttribute('aria-pressed', 'false');
            renderLeaderboard();
        });

        function filterLeaderboard() {
            var input = document.getElementById('leaderboard-filter').value.toLowerCase();
            var visibleCount = 0;
            var tableId = currentBoard === 'discourse' ? '#discourse-table' : '#github-table';
            var podiumId = currentBoard === 'discourse' ? '#discourse-podium' : '#github-podium';

            var rows = document.querySelectorAll(tableId + ' tbody tr');
            rows.forEach(function (row) {
                var username = row.querySelector('.leaderboard-username');
                if (username) {
                    var matches = username.textContent.toLowerCase().includes(input);
                    row.style.display = matches ? '' : 'none';
                    if (matches) visibleCount++;
                }
            });

            var cards = document.querySelectorAll(podiumId + ' .podium-card');
            cards.forEach(function (card) {
                var username = card.querySelector('.podium-username');
                if (username) {
                    var matches = username.textContent.toLowerCase().includes(input);
                    card.style.display = matches ? '' : 'none';
                    if (matches) visibleCount++;
                }
            });

            var emptyState = document.getElementById('leaderboard-empty-state');
            if (input && visibleCount === 0) {
                emptyState.textContent = 'No members match that search.';
                emptyState.style.display = '';
            } else if (rows.length === 0 && cards.length === 0) {
                emptyState.textContent = 'No activity for this period yet.';
                emptyState.style.display = '';
            } else {
                emptyState.style.display = 'none';
            }
        };

        document.getElementById('leaderboard-filter').addEventListener('input', filterLeaderboard);

        renderLeaderboard();
    })();
</script>
