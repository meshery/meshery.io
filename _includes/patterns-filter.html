<style>
  #compatibility-div img {
    max-width: 50px;
    height: 100%;
  }
  #compatibility-div {
    max-height: 360px;
    overflow-y: auto;
    padding-right: 1.25rem;
    height: min-content;
  }
  .page-info {
    margin: 0 1rem;
    align-self: center;
    font-weight: bold;
    color: var(--color-secondary-dark);
  }
</style>

{% capture sort_icons %}
<span class="sort-arrow" aria-hidden="true">
  <svg class="sort-icon sort-icon-none" viewBox="0 0 10 10"><path d="M5 0 8 4H2z" /><path d="M5 10 2 6h6z" /></svg>
  <svg class="sort-icon sort-icon-desc" viewBox="0 0 10 10"><path d="M5 8 1 3h8z" /></svg>
  <svg class="sort-icon sort-icon-asc" viewBox="0 0 10 10"><path d="M5 2 9 7H1z" /></svg>
</span>
{% endcapture %}

<div class="models-filter-wrap">
  <button type="button" class="models-filter-toggle" id="models-filter-toggle"
          aria-expanded="false" aria-controls="models-filter-panel"
          title="Filters" aria-label="Filters">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
      <path d="M3.9 54.9C10.5 40.9 24.5 32 40 32H472c15.5 0 29.5 8.9 36.1 22.9s4.6 30.5-5.2 42.5L320 320.9V448c0 12.1-6.8 23.2-17.7 28.6s-23.8 4.3-33.5-3l-64-48c-8.1-6-12.8-15.5-12.8-25.6V320.9L9 97.3C-.7 85.4-2.8 68.8 3.9 54.9z"/>
    </svg>
  </button>

  <aside class="models-filter" id="models-filter-panel" aria-label="Filters">
    <div class="models-filter-head">
      <strong>Filters</strong>
      <button type="button" class="models-filter-close"
              id="models-filter-close" aria-label="Close filters">&times;</button>
    </div>

    <div class="filter-wrap">
      {% if show_technology == "true" %}
      <p id="compatibility-para" class="compatibility-para">
        <span class="filter-heading">
          <strong>Technologies:</strong>
          <button type="button" class="sort-btn" id="compatibility-sort"
                  data-order="none" title="Sort by count"
                  aria-label="Sort technologies by count">{{ sort_icons }}</button>
        </span>
      </p>
      <div id="compatibility-div" class="compatibility-div"></div>
      {% endif %}

      <p id="category-para" class="category-para">
        <span class="filter-heading">
          <strong>Categories:</strong>
          <button type="button" class="sort-btn" id="category-sort"
                  data-order="none" title="Sort by count"
                  aria-label="Sort categories by count">{{ sort_icons }}</button>
        </span>
      </p>
      <div id="category-div" class="category-div"></div>
    </div>
  </aside>
</div>

<script type="module">
  const pageKey = window.location.pathname;

  function loadFilter(name) {
    try { return JSON.parse(sessionStorage.getItem(`selected_${name}_${pageKey}`)) || []; }
    catch { return []; }
  }
  function saveFilter(name, list) {
    try { sessionStorage.setItem(`selected_${name}_${pageKey}`, JSON.stringify(list)); }
    catch { /* storage unavailable */ }
  }

  // import all integrations data
  import data from "{{ site.baseurl }}/integrations/data.js";
  // add wasmFilter to data array
  const wasmFilter = {
    name: "wasm-filter",
    color: "../assets/images/webassembly_logo.svg",
    white: "../assets/images/webassembly_logo.svg",
  };

  data.push(wasmFilter);

  // Function to compare the names of all catalog entries by technology
  // TODO: Improve so that catalog entries can be sorted by pattern name, too.
  function compare(a, b) {
    // Use toUpperCase() to ignore character casing
    const nameA = a.name.toUpperCase();
    const nameB = b.name.toUpperCase();

    let comparison = 0;
    if (nameA > nameB) {
      comparison = 1;
    } else if (nameA < nameB) {
      comparison = -1;
    }
    return comparison;
  }

  // sort catalog entries by alphabetically by technology type
  data.sort(compare);

  // get all empty filter containers
  const container = document.getElementById("compatibility-div");
  const categoryContainer = document.getElementById("category-div");

  // globalTechnologyList stores all the technologies checked by user as strings
  // example: ["gcp", "keda"]
  let globalTechnologyList = loadFilter('technologies');
  // globalCategoryList stores the categories selected by the user (multiple allowed)
  let globalCategoryList = loadFilter('categories');
  // get all pattern cards
  const patternCards = document.querySelectorAll(".patternCard");

  const cardCompatibility = [];
  // cardType stores the names of all categories (unique)
  let cardType = new Set();
  // cardPatternType stores the names of all pattern types (unique)
  let cardPatternType = new Set();
  // cardTechnology stores the set of all technologies (unique)
  let cardTechnology = new Set();
  // Count of each category, example: {"deployment": 102, "security": 10, ...}
  const categoryCardCount = {};
  const patternTypeCardCount = {};

  // Loop over all pattern cards to get their compatibility, type and technology
  for (let i = 0; i < patternCards.length; i++) {
    const type = patternCards[i].getAttribute("type");

    const patternType = patternCards[i].getAttribute("patternType");

    if (type && type !== "wasm filter") {
      const lowerCaseType = type?.toLowerCase();
      cardType.add(lowerCaseType);
      categoryCardCount[lowerCaseType] =
        (categoryCardCount[lowerCaseType] || 0) + 1;
    }
    if (patternType) {
      const lowerCasePatternType = patternType?.toLowerCase();
      cardPatternType.add(lowerCasePatternType);
      patternTypeCardCount[lowerCasePatternType] =
        (patternTypeCardCount[lowerCasePatternType] || 0) + 1;
    }

    const technology = patternCards[i].getAttribute("technology");

    if (technology) {
      let t = JSON.parse(technology);
      for (let i = 0; i < t.length; i++) {
        cardTechnology.add(t[i]);
        cardCompatibility.push(t[i]);
      }
    }
  }

  cardType = Array.from(cardType);
  cardTechnology = Array.from(cardTechnology);
  cardPatternType = Array.from(cardPatternType);

  // For creating a list of checkboxes for Categories section
  for (let i = 0; i < cardType.length; i++) {
    const count = categoryCardCount[cardType[i]];
    const inputContainer = document.createElement("div");
    inputContainer.className = "input-container";
    inputContainer.dataset.count = count;

    const input = document.createElement("input");
    input.type = "checkbox";
    input.name = "type";
    input.value = cardType[i];
    input.id = cardType[i];
    if (globalCategoryList.includes(cardType[i])) {
      input.checked = true;
    }
    // When it is checked or unchecked, updateCategoryList is called followed by showFilterCards
    input.onclick = function () {
      updateCategoryList(cardType[i]);
      showFilterCards();
    };
    inputContainer.appendChild(input);
    const label = document.createElement("label");
    label.innerHTML = `<div class="name">${cardType[i].replace(
      /-/g,
      " "
    )}</div><div class="badge">${count}</div>`;
    label.style.height = "20px";
    label.setAttribute("for", cardType[i]);
    inputContainer.appendChild(label);
    categoryContainer.appendChild(inputContainer);
  }

  // Remove duplicate entries of integrations in filter section
  const filterEntries = [];
  cardTechnology = Array.from(new Set(cardTechnology));
  // For creating a list of checkboxes for Technologies section
  for (let i = 0; i < data.length; i++) {
    const count = cardCompatibility.filter(
      (item) => item === data[i].name
    ).length;
    // Skip if not used in any card, or already added
    if (count === 0 || filterEntries.includes(data[i].name)) continue;

    filterEntries.push(data[i].name);

    const inputContainer = document.createElement("div");
    inputContainer.className = "input-container";
    inputContainer.dataset.count = count;
    const input = document.createElement("input");
    input.type = "checkbox";
    input.name = data[i].name;
    input.value = data[i].name;
    input.id = data[i].name;
    if (globalTechnologyList.includes(data[i].name)) {
      input.checked = true;
    }
    input.onclick = function () {
      updateTechnologyList(data[i].name);
      showFilterCards();
    };
    inputContainer.appendChild(input);
    const label = document.createElement("label");
    let colorImg = "/" + data[i].color.split("/").slice(1).join("/");
    let whiteImg = "/" + data[i].white.split("/").slice(1).join("/");
    label.innerHTML = `<img src="${colorImg}" id="logo-dark-light" data-logo-for-dark="${whiteImg ?? colorImg
      }"data-logo-for-light="${colorImg}" /><div class="name">${data[
        i
      ].name.replace(/-/g, " ")}</div><div class="badge">${count}</div>`;
    label.style.height = "20px";
    label.setAttribute("for", data[i].name);
    inputContainer.appendChild(label);
    container.appendChild(inputContainer);
  }

  // Adds the technology to the list if it is not there, removes it if it is
  function updateTechnologyList(value) {
    if (globalTechnologyList.includes(value)) {
      globalTechnologyList = globalTechnologyList.filter(
        (item) => item !== value
      );
    } else {
      globalTechnologyList.push(value);
    }
    saveFilter('technologies', globalTechnologyList);
  }

  // Updates the category list depending on whether the box is checked
  function updateCategoryList(value) {
    if (document.getElementById(value).checked) {
      globalCategoryList.push(value);
    } else {
      globalCategoryList = globalCategoryList.filter((item) => item !== value);
      if (globalCategoryList.length === 0) {
        globalCategoryList = [];
      }
    }
    saveFilter('categories', globalCategoryList);
  }

  // Function called when user clicks on any of Technology checkboxes or Category boxes
  function showFilterCards() {
    const patternCards = Array.from(document.querySelectorAll('.patternCard'));
    const itemsPerPage = 11;
    let currentPage = 0;

    // First, filter the cards that match our criteria
    const matchingCards = patternCards.filter(card => {
      const type = card.getAttribute("type")?.toLowerCase();
      const technologyAttr = card.getAttribute("technology");

      const technologies = technologyAttr ? JSON.parse(technologyAttr) : [];

      const showCardTech = globalTechnologyList.length === 0 ||
                          globalTechnologyList.some(tech => technologies.includes(tech));

      const showCardCat = globalCategoryList.length === 0 ||
                         globalCategoryList.some(cat => type.includes(cat));

      return showCardTech && showCardCat;
    });

    // Hide all cards first
    patternCards.forEach(card => {
      card.style.display = "none";
    });

    // Update "not found" message
    const noCard = document.getElementById("not-found");
    noCard.style.display = matchingCards.length > 0 ? "none" : "block";

    // Get pagination elements
    const paginationButtons = document.querySelector(".pagination");
    const prevButton = document.getElementById("designs-prev") || document.getElementById("models-prev") || document.getElementById("filters-prev");
    const nextButton = document.getElementById("designs-next") || document.getElementById("models-next") || document.getElementById("filters-next");

    function updatePagination() {
      const totalPages = Math.ceil(matchingCards.length / itemsPerPage);
      prevButton.disabled = currentPage === 0;
      nextButton.disabled = currentPage + 1 >= totalPages || totalPages === 0;

      const pageInfo = prevButton.parentElement.querySelector(".page-info");

      if (pageInfo) {
        if (totalPages > 0) {
          pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;
          pageInfo.style.display = "inline";
        } else {
          pageInfo.style.display = "none";
        }
      }
    }

    function showCardsForPage() {
      const start = currentPage * itemsPerPage;
      const end = Math.min(start + itemsPerPage, matchingCards.length);

      for (let i = 0; i < matchingCards.length; i++) {
        matchingCards[i].style.display = (i >= start && i < end) ? "block" : "none";
      }

      updatePagination();
    }

    prevButton.onclick = function () {
      if (currentPage > 0) {
        currentPage--;
        showCardsForPage();
      }
    };

    nextButton.onclick = function () {
      const totalPages = Math.ceil(matchingCards.length / itemsPerPage);
      if (currentPage + 1 < totalPages) {
        currentPage++;
        showCardsForPage();
      }
    };

    paginationButtons.style.display = matchingCards.length > itemsPerPage ? "flex" : "none";

    currentPage = 0;
    showCardsForPage();

    return matchingCards.length;
  }

  showFilterCards();
</script>

<script>
  // Sort-by-count controls for the Technologies and Categories filter sections.
  // Each control cycles through: unsorted -> descending -> ascending.
  // The checkbox list is built by the module script above, so the original
  // order and counts are read lazily on the first click.
  (function () {
    var sortSections = [
      { key: "compatibility", container: "compatibility-div", button: "compatibility-sort" },
      { key: "category", container: "category-div", button: "category-sort" },
    ];

    sortSections.forEach(function (section) {
      var button = document.getElementById(section.button);
      var container = document.getElementById(section.container);
      // Technologies section is absent on pages that opt out (e.g. Models).
      if (!button || !container) return;

      var order = "none";
      var originalOrder = null;

      button.addEventListener("click", function () {
        if (!originalOrder) {
          originalOrder = Array.prototype.slice.call(container.children);
        }
        order = order === "none" ? "desc" : order === "desc" ? "asc" : "none";
        applyOrder(container, order, originalOrder);
        updateButton(button, order);
      });
    });

    function applyOrder(container, order, originalOrder) {
      if (order === "none") {
        originalOrder.forEach(function (el) {
          container.appendChild(el);
        });
        return;
      }
      var items = Array.prototype.slice.call(
        container.querySelectorAll(".input-container")
      );
      items.sort(function (a, b) {
        var countA = Number(a.dataset.count) || 0;
        var countB = Number(b.dataset.count) || 0;
        return order === "asc" ? countA - countB : countB - countA;
      });
      items.forEach(function (el) {
        container.appendChild(el);
      });
    }

    // The icon is shown by CSS based on data-order, so no textContent change here.
    function updateButton(button, order) {
      var baseLabel = (button.getAttribute("aria-label") || "Sort by count").split(" (")[0];
      var suffix = order === "desc" ? " (high to low)"
                 : order === "asc"  ? " (low to high)"
                 : "";

      button.classList.toggle("active", order !== "none");
      button.setAttribute("aria-label", baseLabel + suffix);
      button.setAttribute("data-order", order);
    }
  })();
</script>

<script src="{{ site.baseurl }}/assets/js/filter-panel.js"></script>
<script>
  initFilterPanel({
    toggleId: "models-filter-toggle",
    panelId: "models-filter-panel",
    closeId: "models-filter-close"
  });
</script>
